<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skuzic · make art with music</title>
    <meta
      name="description"
      content="Make art with music. Every line you draw rings in key, and the music follows your picture."
    />
    <meta property="og:title" content="skuzic" />
    <meta
      property="og:description"
      content="Make art with music."
    />
    <meta name="theme-color" content="#eff0f3" />
    <link rel="icon" type="image/svg+xml" href="/brand/skuzic-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..800&display=swap"
    />
    <!-- Applied before first paint, so the page never flashes the wrong theme.
         "system" (the default) follows the OS; App.tsx keeps it in sync after. -->
    <script>try{var t=JSON.parse(localStorage.getItem('skuzic_theme')||'"system"'),d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d);document.querySelector('meta[name="theme-color"]').setAttribute('content',d?'#131417':'#eff0f3')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
